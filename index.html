<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel and transport - Unit 2</title>
    <style>
        :root{--color-primary:#4F46E5;--color-secondary:#06B6D4;--color-accent:#F59E0B;--color-bg:#F8FAFC;--color-card:#FFFFFF;--color-correct:#22C55E;--color-wrong:#EF4444;--color-selecting:#2563EB;--color-pending:#FEF3C7;--color-pending-text:#92400E;}
        body { font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif; background-color: var(--color-bg); margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .progress-container { width: 100%; max-width: 800px; margin: 0 auto 20px; background: #e2e8f0; border-radius: 8px; height: 16px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--color-primary); width: 0%; transition: width 0.3s; }
        .progress-text { text-align: center; font-size: 14px; margin-top: 5px; font-weight: bold; }
        .card { background: var(--color-card); border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 20px; margin: 0 auto 20px; max-width: 800px; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        h1 { font-size: 22px; font-weight: 700; }
        .question-text { font-size: 21px; font-weight: 600; line-height: 1.6; margin-bottom: 18px; }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option { padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: 500; display: flex; align-items: center; transition: all 0.2s; }
        .option.pending { background: var(--color-pending); color: var(--color-pending-text); border-color: var(--color-pending-text); transform: scale(1.02); }
        .option.correct { background: var(--color-correct); color: white; border-color: var(--color-correct); }
        .option.wrong { background: var(--color-wrong); color: white; border-color: var(--color-wrong); animation: shake 0.15s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .btn { padding: 14px 20px; background: var(--color-primary); color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: 600; cursor: pointer; min-height: 52px; margin-top: 20px; width: 100%; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .explanation { display: none; margin-top: 20px; padding: 15px; background: #f1f5f9; border-radius: 8px; font-size: 17px; line-height: 1.8; }
        .locked { pointer-events: none; cursor: not-allowed; }
        input[type="text"] { font-size: 18px; padding: 8px; border: 2px solid #cbd5e1; border-radius: 6px; width: 200px; }
        input[type="text"].pending { background: var(--color-pending); color: var(--color-pending-text); border-color: var(--color-pending-text); }
        input[type="text"].correct { border-color: var(--color-correct); background: #dcfce7; }
        input[type="text"].wrong { border-color: var(--color-wrong); background: #fee2e2; }
        .correct-answer-inline { color: var(--color-correct); font-weight: bold; margin-left: 10px; }
        #mistakes-section { display: none; max-width: 800px; margin: 40px auto; }
        .mistake-card { border: 2px solid var(--color-wrong); }
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .popup-content { background: white; padding: 30px; border-radius: 16px; text-align: center; max-width: 400px; }
        .popup-btn { margin-top: 20px; padding: 10px 20px; background: var(--color-primary); color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Travel and transport - Unit 2</h1>
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="progress-text" id="progress-text">0 / 0 câu đã trả lời</div>
    </div>

    <div id="quiz-container"></div>
    <div style="max-width: 800px; margin: 0 auto;">
        <button id="submit-btn" class="btn" style="background: var(--color-accent);">Nộp bài</button>
    </div>
    
    <div id="mistakes-section">
        <h2>DANH SÁCH CÁC CÂU LÀM SAI</h2>
        <div id="mistakes-container"></div>
    </div>

    <div class="popup-overlay" id="popup">
        <div class="popup-content">
            <h2 id="popup-title">Kết quả</h2>
            <p id="popup-message"></p>
            <button class="popup-btn" onclick="closePopup()">Xem chi tiết</button>
        </div>
    </div>

    <script>
        const quizData = [{"id": "A1", "type": "multiple_choice", "questionHTML": "<b>Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang:</b> You need a passport to cross the ............ between Mexico and the United States.", "options": [{"label": "A", "html": "edge", "isCorrect": false}, {"label": "B", "html": "line", "isCorrect": false}, {"label": "C", "html": "border", "isCorrect": true}, {"label": "D", "html": "rim", "isCorrect": false}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>C\u00e2u h\u1ecfi: B\u1ea1n c\u1ea7n h\u1ed9 chi\u1ebfu \u0111\u1ec3 qua bi\u00ean gi\u1edbi gi\u1eefa Mexico v\u00e0 Hoa K\u1ef3.<br/>A. edge (n): r\u00eca, m\u00e9p<br/>B. line (n): \u0111\u01b0\u1eddng k\u1ebb<br/>C. border (n): bi\u00ean gi\u1edbi (\u0111\u00e1p \u00e1n \u0111\u00fang v\u00ec ph\u00f9 h\u1ee3p ng\u1eef c\u1ea3nh)<br/>D. rim (n): v\u00e0nh<br/>V\u00ec sao c\u00e1c \u0111\u00e1p \u00e1n kh\u00e1c sai: edge, line, rim kh\u00f4ng d\u00f9ng \u0111\u1ec3 ch\u1ec9 bi\u00ean gi\u1edbi qu\u1ed1c gia."}, {"id": "A2", "type": "multiple_choice", "questionHTML": "<b>Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang:</b> The hotel where we are ............ is quite luxurious.", "options": [{"label": "A", "html": "living", "isCorrect": false}, {"label": "B", "html": "remaining", "isCorrect": false}, {"label": "C", "html": "existing", "isCorrect": false}, {"label": "D", "html": "staying", "isCorrect": true}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>C\u00e2u h\u1ecfi: Kh\u00e1ch s\u1ea1n n\u01a1i ch\u00fang t\u00f4i \u0111ang \u1edf kh\u00e1 sang tr\u1ecdng.<br/>A. living (v): sinh s\u1ed1ng (l\u00e2u d\u00e0i)<br/>B. remaining (v): c\u00f2n l\u1ea1i<br/>C. existing (v): t\u1ed3n t\u1ea1i<br/>D. staying (v): \u1edf l\u1ea1i, l\u01b0u tr\u00fa (\u0111\u00e1p \u00e1n \u0111\u00fang, d\u00f9ng cho l\u01b0u tr\u00fa t\u1ea1m th\u1eddi nh\u01b0 kh\u00e1ch s\u1ea1n)<br/>C\u00e1c \u0111\u00e1p \u00e1n kh\u00e1c kh\u00f4ng ph\u00f9 h\u1ee3p v\u1ec1 ngh\u0129a."}, {"id": "A3", "type": "multiple_choice", "questionHTML": "<b>Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang:</b> When you ............ your destination, your tour guide will meet you at the airport.", "options": [{"label": "A", "html": "arrive", "isCorrect": false}, {"label": "B", "html": "get", "isCorrect": false}, {"label": "C", "html": "reach", "isCorrect": true}, {"label": "D", "html": "achieve", "isCorrect": false}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>C\u00e2u h\u1ecfi: Khi b\u1ea1n \u0111\u1ebfn \u0111i\u1ec3m \u0111\u1ebfn, h\u01b0\u1edbng d\u1eabn vi\u00ean s\u1ebd \u0111\u00f3n b\u1ea1n t\u1ea1i s\u00e2n bay.<br/>A. arrive (v): \u0111i v\u1edbi at/in<br/>B. get (v): \u0111i v\u1edbi to<br/>C. reach (v): \u0111\u1ebfn (kh\u00f4ng c\u1ea7n gi\u1edbi t\u1eeb \u0111i k\u00e8m, \u0111\u00fang)<br/>D. achieve (v): \u0111\u1ea1t \u0111\u01b0\u1ee3c (m\u1ee5c ti\u00eau)<br/>V\u00ec destination kh\u00f4ng c\u00f3 gi\u1edbi t\u1eeb \u0111\u1ee9ng tr\u01b0\u1edbc n\u00ean ch\u1ec9 d\u00f9ng reach."}, {"id": "B1", "type": "multiple_choice", "questionHTML": "<b>Ch\u1ecdn t\u1eeb \u0111\u00fang:</b> I hope to go on a trip round the ............ one day.", "options": [{"label": "A", "html": "world", "isCorrect": true}, {"label": "B", "html": "earth", "isCorrect": false}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>C\u00e2u h\u1ecfi: T\u00f4i hy v\u1ecdng m\u1ed9t ng\u00e0y n\u00e0o \u0111\u00f3 s\u1ebd \u0111i m\u1ed9t chuy\u1ebfn v\u00f2ng quanh th\u1ebf gi\u1edbi.<br/>A. world: th\u1ebf gi\u1edbi (\u0111\u00e1p \u00e1n \u0111\u00fang, c\u1ee5m t\u1eeb 'round the world')<br/>B. earth: tr\u00e1i \u0111\u1ea5t<br/>V\u00ec sao sai: Kh\u00f4ng d\u00f9ng 'round the earth' trong ng\u1eef c\u1ea3nh du l\u1ecbch."}, {"id": "C1", "type": "gap_fill_text", "questionHTML": "<b>\u0110i\u1ec1n t\u1eeb:</b> Let's go to the airport to {{blank:b1}} Grandpa off when he flies back home.", "blanks": [{"blankId": "b1", "correctAnswers": ["see"]}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>C\u00e2u: H\u00e3y \u0111\u1ebfn s\u00e2n bay \u0111\u1ec3 ti\u1ec5n \u00f4ng khi \u00f4ng bay v\u1ec1 nh\u00e0.<br/>D\u00f9ng c\u1ee5m \u0111\u1ed9ng t\u1eeb 'see someone off' (ti\u1ec5n ai \u0111\u00f3). T\u1eeb c\u1ea7n \u0111i\u1ec1n l\u00e0 'see'."}, {"id": "D1", "type": "gap_fill_text", "questionHTML": "<b>Vi\u1ebft phrasal verb:</b> We can start our journey (<i>start our journey</i>) towards the mountains at dawn. -> We can {{blank:b1}} towards the mountains at dawn.", "blanks": [{"blankId": "b1", "correctAnswers": ["set off"]}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>Phrasal verb thay th\u1ebf cho 'start our journey' l\u00e0 'set off' (kh\u1edfi h\u00e0nh)."}, {"id": "E1", "type": "gap_fill_text", "questionHTML": "<b>\u0110i\u1ec1n m\u1ed9t t\u1eeb:</b> The speed {{blank:b1}} in towns is 50 km/h and you shouldn't go faster than that.", "blanks": [{"blankId": "b1", "correctAnswers": ["limit"]}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>C\u00e2u: Gi\u1edbi h\u1ea1n t\u1ed1c \u0111\u1ed9 trong th\u1ecb tr\u1ea5n l\u00e0 50 km/h...<br/>C\u1ee5m t\u1eeb 'speed limit' ngh\u0129a l\u00e0 gi\u1edbi h\u1ea1n t\u1ed1c \u0111\u1ed9."}, {"id": "F1", "type": "multiple_choice", "questionHTML": "<b>Ch\u1ecdn \u0111\u00e1p \u00e1n \u0111\u00fang:</b> I've always dreamt ............ China.", "options": [{"label": "A", "html": "to visit", "isCorrect": false}, {"label": "B", "html": "of visiting", "isCorrect": true}, {"label": "C", "html": "I visit", "isCorrect": false}, {"label": "D", "html": "visit", "isCorrect": false}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>C\u00e2u: T\u00f4i lu\u00f4n m\u01a1 v\u1ec1 vi\u1ec7c th\u0103m Trung Qu\u1ed1c.<br/>C\u1ea5u tr\u00fac 'dream of V-ing' (m\u01a1 v\u1ec1 vi\u1ec7c g\u00ec)."}, {"id": "G1", "type": "gap_fill_text", "questionHTML": "<b>T\u00ecm t\u1eeb th\u1eeba:</b> Oh, let me tell you about our trip. Did you know that Sara is afraid of be flying?<br/>T\u1eeb th\u1eeba: {{blank:b1}}", "blanks": [{"blankId": "b1", "correctAnswers": ["be"]}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>'afraid of flying' ch\u1ee9 kh\u00f4ng ph\u1ea3i 'afraid of be flying'. Gi\u1edbi t\u1eeb 'of' + V-ing/N. T\u1eeb 'be' l\u00e0 th\u1eeba."}, {"id": "H1", "type": "gap_fill_text", "questionHTML": "<b>Chia d\u1ea1ng \u0111\u00fang c\u1ee7a t\u1eeb (TOUR):</b> It's not always easy being a {{blank:b1}}.", "blanks": [{"blankId": "b1", "correctAnswers": ["tourist"]}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>Sau m\u1ea1o t\u1eeb 'a' c\u1ea7n m\u1ed9t danh t\u1eeb ch\u1ec9 ng\u01b0\u1eddi. TOUR -> tourist (kh\u00e1ch du l\u1ecbch)."}, {"id": "I1", "type": "gap_fill_text", "questionHTML": "<b>Chia d\u1ea1ng \u0111\u00fang c\u1ee7a t\u1eeb (RECOGNISE):</b> Beijing has changed so much in the last few years that it's almost {{blank:b1}}.", "blanks": [{"blankId": "b1", "correctAnswers": ["unrecognisable", "unrecognizable"]}], "explanationHTML": "<b>Gi\u1ea3i th\u00edch:</b><br/>B\u1eafc Kinh \u0111\u00e3 thay \u0111\u1ed5i qu\u00e1 nhi\u1ec1u \u0111\u1ebfn n\u1ed7i g\u1ea7n nh\u01b0 kh\u00f4ng th\u1ec3 nh\u1eadn ra. RECOGNISE -> unrecognisable (adj): kh\u00f4ng th\u1ec3 nh\u1eadn ra."}];
        let userState = {};
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq1, freq2, duration, type='sine', gainVal=0.15) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.frequency.setValueAtTime(freq1, ctx.currentTime);
                if (freq2) {
                    osc.frequency.setValueAtTime(freq2, ctx.currentTime + duration*0.4);
                }
                
                gain.gain.setValueAtTime(gainVal, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        function playSelectSound() { playTone(600, null, 0.08); }
        function playCorrectSound() { playTone(800, 1200, 0.25, 'sine', 0.2); }
        function playWrongSound() { playTone(150, null, 0.2, 'square', 0.12); }
        function playSubmitSound() { playTone(500, null, 0.12); }

        function escapeHTML(str) {
            const d = document.createElement('div');
            d.textContent = str;
            return d.innerHTML;
        }

        function normalizeAnswer(str) {
            return str.trim().replace(/\s+/g, ' ').toLowerCase();
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initQuiz() {
            const container = document.getElementById('quiz-container');
            
            // Randomize correct answers positions in quizData (Rule 4)
            quizData.forEach(q => {
                if (q.type === 'multiple_choice') {
                    shuffle(q.options);
                    q.options.forEach((opt, idx) => {
                        opt.displayLabel = String.fromCharCode(65 + idx);
                    });
                }
                
                userState[q.id] = { checked: false, isCorrect: null, answer: q.type.startsWith('gap_fill') && q.blanks ? {} : null, blankResults: q.blanks ? {} : null };
                if (q.blanks) {
                    q.blanks.forEach(b => userState[q.id].answer[b.blankId] = null);
                }
            });

            quizData.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.id = `card-${q.id}`;

                let html = `<div class="question-text">${q.id}. ${q.questionHTML}</div>`;
                
                if (q.type === 'multiple_choice') {
                    html += `<div class="options" id="options-${q.id}">`;
                    q.options.forEach(opt => {
                        html += `<div class="option" onclick="handleOptionSelect('${q.id}', '${opt.label}')" id="opt-${q.id}-${opt.label}">
                            <strong>${opt.displayLabel}.</strong>&nbsp;${opt.html}
                        </div>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'gap_fill_text') {
                    html = html.replace(/\{\{blank:(b\d+)\}\}/g, (match, bId) => {
                        return `<input type="text" id="input-${q.id}-${bId}" oninput="handleInput('${q.id}', '${bId}', this.value)" autocomplete="off">
                        <span id="correct-${q.id}-${bId}" class="correct-answer-inline" style="display:none;"></span>`;
                    });
                }

                html += `<button class="btn" id="check-btn-${q.id}" onclick="checkAnswer('${q.id}')" disabled>Kiểm tra</button>`;
                html += `<div class="explanation" id="exp-${q.id}">${q.explanationHTML}</div>`;
                
                card.innerHTML = html;
                container.appendChild(card);
            });
            updateProgress();
        }

        function handleOptionSelect(qId, label) {
            if (userState[qId].checked) return;
            userState[qId].answer = label;
            
            document.querySelectorAll(`#options-${qId} .option`).forEach(el => el.classList.remove('pending'));
            document.getElementById(`opt-${qId}-${label}`).classList.add('pending');
            
            playSelectSound();
            document.getElementById(`check-btn-${qId}`).disabled = false;
            updateProgress();
        }

        function handleInput(qId, bId, value) {
            if (userState[qId].checked) return;
            
            const wasEmpty = !userState[qId].answer[bId];
            userState[qId].answer[bId] = value;
            
            const inputEl = document.getElementById(`input-${qId}-${bId}`);
            if (value.trim()) {
                inputEl.classList.add('pending');
                if (wasEmpty) playSelectSound();
            } else {
                inputEl.classList.remove('pending');
            }

            const q = quizData.find(x => x.id === qId);
            const allFilled = q.blanks.every(b => userState[qId].answer[b.blankId] && userState[qId].answer[b.blankId].trim() !== '');
            document.getElementById(`check-btn-${qId}`).disabled = !allFilled;
            updateProgress();
        }

        function updateProgress() {
            const total = quizData.length;
            let answered = 0;
            quizData.forEach(q => {
                if (q.type === 'multiple_choice' && userState[q.id].answer) answered++;
                if (q.type === 'gap_fill_text' && q.blanks.every(b => userState[q.id].answer[b.blankId] && userState[q.id].answer[b.blankId].trim() !== '')) answered++;
            });
            document.getElementById('progress-bar').style.width = `${(answered/total)*100}%`;
            document.getElementById('progress-text').textContent = `${answered} / ${total} câu đã trả lời`;
        }

        function checkAnswer(qId) {
            const state = userState[qId];
            const q = quizData.find(x => x.id === qId);
            if (state.checked) return;

            state.checked = true;
            document.getElementById(`check-btn-${qId}`).disabled = true;
            document.getElementById(`card-${qId}`).classList.add('locked');
            
            if (q.type === 'multiple_choice') {
                const correctOpt = q.options.find(o => o.isCorrect);
                state.isCorrect = (state.answer === correctOpt.label);
                
                document.getElementById(`opt-${qId}-${state.answer}`).classList.remove('pending');
                
                if (state.isCorrect) {
                    document.getElementById(`opt-${qId}-${state.answer}`).classList.add('correct');
                    playCorrectSound();
                } else {
                    document.getElementById(`opt-${qId}-${state.answer}`).classList.add('wrong');
                    document.getElementById(`opt-${qId}-${correctOpt.label}`).classList.add('correct');
                    playWrongSound();
                }
            } else if (q.type === 'gap_fill_text') {
                let allCorrect = true;
                q.blanks.forEach(b => {
                    const ans = normalizeAnswer(state.answer[b.blankId] || '');
                    const isCor = b.correctAnswers.map(normalizeAnswer).includes(ans);
                    state.blankResults[b.blankId] = isCor;
                    
                    const inputEl = document.getElementById(`input-${qId}-${b.blankId}`);
                    inputEl.classList.remove('pending');
                    
                    if (isCor) {
                        inputEl.classList.add('correct');
                    } else {
                        allCorrect = false;
                        inputEl.classList.add('wrong');
                        const correctSpan = document.getElementById(`correct-${qId}-${b.blankId}`);
                        correctSpan.textContent = `(${b.correctAnswers[0]})`;
                        correctSpan.style.display = 'inline';
                    }
                });
                state.isCorrect = allCorrect;
                if (allCorrect) playCorrectSound();
                else playWrongSound();
            }

            document.getElementById(`exp-${qId}`).style.display = 'block';
        }

        document.getElementById('submit-btn').addEventListener('click', () => {
            quizData.forEach(q => {
                if (!userState[q.id].checked) {
                    if (q.type === 'multiple_choice' && !userState[q.id].answer) {
                        userState[q.id].checked = true;
                        userState[q.id].isCorrect = false;
                        const correctOpt = q.options.find(o => o.isCorrect);
                        document.getElementById(`opt-${q.id}-${correctOpt.label}`).classList.add('correct');
                        document.getElementById(`exp-${q.id}`).style.display = 'block';
                    } else if (q.type === 'gap_fill_text' && q.blanks.some(b => !userState[q.id].answer[b.blankId])) {
                         userState[q.id].checked = true;
                         userState[q.id].isCorrect = false;
                         q.blanks.forEach(b => {
                             if(!userState[q.id].answer[b.blankId]) {
                                 userState[q.id].blankResults[b.blankId] = false;
                                 document.getElementById(`correct-${q.id}-${b.blankId}`).textContent = `(${b.correctAnswers[0]})`;
                                 document.getElementById(`correct-${q.id}-${b.blankId}`).style.display = 'inline';
                             }
                         });
                         document.getElementById(`exp-${q.id}`).style.display = 'block';
                    }
                }
            });

            document.getElementById('submit-btn').disabled = true;
            
            const totalGradable = quizData.length;
            const correctCount = quizData.filter(q => userState[q.id].isCorrect).length;
            const score = Math.round((correctCount / totalGradable) * 10);
            
            if (correctCount === totalGradable) playCorrectSound();
            else playSubmitSound();

            let errorsText = "";
            quizData.forEach(q => {
                if(userState[q.id].isCorrect === false) {
                    if (q.type === 'multiple_choice') {
                        const correctOpt = q.options.find(o => o.isCorrect);
                        let ans = userState[q.id].answer ? userState[q.id].answer : "Không chọn";
                        errorsText += `Câu ${q.id}: Học sinh chọn ${ans} (sai), đáp án đúng là ${correctOpt.label}\n`;
                    } else {
                        errorsText += `Câu ${q.id}: Sai từ điền\n`;
                    }
                }
            });

            const formData = new URLSearchParams();
            formData.append('entry.1861648410', 'Học Sinh'); 
            formData.append('entry.1691800437', `${score}/10`);
            formData.append('entry.639295732', errorsText || "Không có lỗi");
            formData.append('entry.370465671', 'Travel and transport - Unit 2');

            fetch('https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse', {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            }).then(() => {
                console.log("Submitted");
            }).catch(e => console.error(e));

            document.getElementById('popup-message').innerHTML = `Bạn làm đúng ${correctCount}/${totalGradable} câu.<br>Điểm: ${score}/10`;
            document.getElementById('popup').style.display = 'flex';
            
            renderMistakes();
        });

        function renderMistakes() {
            const container = document.getElementById('mistakes-container');
            const mistakes = quizData.filter(q => userState[q.id].isCorrect === false);
            
            if (mistakes.length === 0) {
                container.innerHTML = "<h3 style='color:var(--color-correct)'>Chúc mừng! Bạn đã trả lời đúng tất cả các câu hỏi!</h3>";
            } else {
                mistakes.forEach(q => {
                    const clone = document.getElementById(`card-${q.id}`).cloneNode(true);
                    clone.classList.add('mistake-card');
                    clone.querySelector('.btn').remove();
                    container.appendChild(clone);
                });
            }
            document.getElementById('mistakes-section').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('mistakes-section').scrollIntoView({behavior: 'smooth'});
        }

        initQuiz();
    </script>
</body>
</html>
