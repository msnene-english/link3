const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playTone(frequency, duration, type) {
  try {
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    oscillator.start();
    oscillator.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function playSelectSound() { playTone(600, 0.08, 'sine'); }
function playCorrectSound() { 
  playTone(800, 0.1, 'sine'); 
  setTimeout(() => playTone(1200, 0.15, 'sine'), 100); 
}
function playWrongSound() { playTone(150, 0.2, 'sawtooth'); }

const quizData = rawData.map((item, index) => {
  return {
    id: index + 1,
    type: "vocab",
    questionHTML: item.q,
    options: item.o.map((optText, optIndex) => ({
      label: String.fromCharCode(65 + optIndex), // A, B, C, D
      html: optText,
      isCorrect: optIndex === item.a
    })),
    explanationHTML: `<p><strong>A. ${item.o[0]}</strong></p>
                      <p><strong>B. ${item.o[1]}</strong></p>
                      <p><strong>C. ${item.o[2]}</strong></p>
                      <p><strong>D. ${item.o[3]}</strong></p>
                      <p>Dịch: ${item.q}</p>
                      <p>Đáp án đúng là <strong>${String.fromCharCode(65 + item.a)}</strong>.</p>
                      <p>Các đáp án khác sai ngữ pháp / ngữ cảnh.</p>`
  };
});

let userState = {};
quizData.forEach(q => {
  userState[q.id] = { selected: null, checked: false, isCorrect: null };
});

const quizContainer = document.getElementById('quiz-content');
const totalText = document.getElementById('total-text');
const progressText = document.getElementById('progress-text');
const progressBar = document.getElementById('progress-bar');
totalText.textContent = quizData.length;

function shuffleArray(array) {
  let shuffled = array.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = 0;
    
  }
  return shuffled;
}

function updateProgress() {
  const answered = Object.values(userState).filter(s => s.selected !== null).length;
  progressText.textContent = answered;
  progressBar.style.width = (answered / quizData.length * 100) + '%';
}

function renderQuiz() {
  quizData.forEach(q => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="question">Câu ${q.id}: ${q.questionHTML}</div>`;
    
    const optionsContainer = document.createElement('div');
    optionsContainer.className = 'options';
    optionsContainer.id = `options-${q.id}`;
    
    let shuffledContents = shuffleArray(q.options);
    let labels = ["A", "B", "C", "D"];
    let shuffledLabels = shuffleArray(labels);
    
    let displayOptions = shuffledContents.map((opt, i) => {
      return {
        displayLabel: shuffledLabels[i],
        html: opt.html,
        originalLabel: opt.label,
        isCorrect: opt.isCorrect
      };
    });
    
    displayOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<strong>${opt.displayLabel}.</strong> ${opt.html}`;
      btn.onclick = () => selectOption(q.id, opt.originalLabel, btn);
      btn.dataset.original = opt.originalLabel;
      optionsContainer.appendChild(btn);
    });
    
    card.appendChild(optionsContainer);
    
    const checkBtn = document.createElement('button');
    checkBtn.className = 'check-btn';
    checkBtn.id = `check-btn-${q.id}`;
    checkBtn.textContent = 'Kiểm tra';
    checkBtn.disabled = true;
    checkBtn.onclick = () => checkAnswer(q.id);
    card.appendChild(checkBtn);
    
    const expDiv = document.createElement('div');
    expDiv.className = 'explanation';
    expDiv.id = `exp-${q.id}`;
    expDiv.innerHTML = q.explanationHTML;
    card.appendChild(expDiv);
    
    quizContainer.appendChild(card);
  });
}

function selectOption(qId, originalLabel, btnElement) {
  if (userState[qId].checked) return;
  userState[qId].selected = originalLabel;
  
  const optionsContainer = document.getElementById(`options-${qId}`);
  Array.from(optionsContainer.children).forEach(btn => btn.classList.remove('pending'));
  btnElement.classList.add('pending');
  
  playSelectSound();
  document.getElementById(`check-btn-${qId}`).disabled = false;
  updateProgress();
}

function checkAnswer(qId, auto = false) {
  if (userState[qId].checked) return;
  const state = userState[qId];
  if (!state.selected && !auto) return;
  
  const qInfo = quizData.find(q => q.id === qId);
  const correctOpt = qInfo.options.find(o => o.isCorrect);
  
  state.checked = true;
  state.isCorrect = (state.selected === correctOpt.label);
  
  const optionsContainer = document.getElementById(`options-${qId}`);
  Array.from(optionsContainer.children).forEach(btn => {
    btn.classList.remove('pending');
    btn.style.pointerEvents = 'none';
    if (btn.dataset.original === correctOpt.label) {
      btn.classList.add('correct');
    } else if (btn.dataset.original === state.selected && !state.isCorrect) {
      btn.classList.add('wrong');
    }
  });
  
  document.getElementById(`check-btn-${qId}`).style.display = 'none';
  document.getElementById(`exp-${qId}`).style.display = 'block';
  
  if (!auto) {
    if (state.isCorrect) playCorrectSound();
    else playWrongSound();
  }
}

document.getElementById('submit-btn').addEventListener('click', function() {
  const studentName = document.getElementById('student-name').value.trim() || 'Khách';
  let correctCount = 0;
  
  quizData.forEach(q => {
    if (!userState[q.id].checked) {
      if (userState[q.id].selected !== null) {
        checkAnswer(q.id, true);
      } else {
        userState[q.id].checked = true;
        userState[q.id].isCorrect = false;
        const optionsContainer = document.getElementById(`options-${q.id}`);
        Array.from(optionsContainer.children).forEach(btn => btn.style.pointerEvents = 'none');
        const correctOpt = q.options.find(o => o.isCorrect);
        Array.from(optionsContainer.children).forEach(btn => {
          if (btn.dataset.original === correctOpt.label) btn.classList.add('correct');
        });
        document.getElementById(`check-btn-${q.id}`).style.display = 'none';
        document.getElementById(`exp-${q.id}`).style.display = 'block';
      }
    }
    if (userState[q.id].isCorrect) correctCount++;
  });
  
  this.disabled = true;
  
  let loisai = "";
  quizData.forEach(q => {
    if (!userState[q.id].isCorrect) {
      loisai += `Câu ${q.id} (chọn ${userState[q.id].selected || 'bỏ trống'}), `;
    }
  });
  
  const score = (correctCount / quizData.length * 10).toFixed(1);
  const tile = `${correctCount}/${quizData.length}`;
  const formUrl = `https://docs.google.com/forms/d/e/1FAIpQLSelQyzh_lWyb2vZUnQ1jc1p9FLRknDZiUt9NiUiiX1epHTFLw/formResponse?entry.351633352=link3&entry.1895948982=${encodeURIComponent(studentName)}&entry.1232319784=${encodeURIComponent(score)}&entry.1125920425=${encodeURIComponent(tile)}&entry.1907417670=${encodeURIComponent(loisai)}`;
  
  fetch(formUrl, { mode: 'no-cors' }).catch(e => console.log(e));
  alert(`Điểm của bạn: ${score}\\nBạn làm đúng ${tile} câu.`);
  
  renderTable();
});

function renderTable() {
  const resContainer = document.getElementById('results-container');
  resContainer.style.display = 'block';
  
  let html = '<h2>Bảng tổng kết</h2>';
  let totalRows = Math.ceil(quizData.length / 20);
  
  for (let r = 0; r < totalRows; r++) {
    html += '<table class="results-table"><tr><th>Câu</th>';
    let end = Math.min((r+1)*20, quizData.length);
    for (let i = r*20; i < end; i++) html += `<th>${quizData[i].id}</th>`;
    html += '</tr>';
    
    ['A','B','C','D'].forEach(label => {
      html += `<tr><th>${label}</th>`;
      for (let i = r*20; i < end; i++) {
        let q = quizData[i];
        let st = userState[q.id];
        let correctOpt = q.options.find(o => o.isCorrect).label;
        
        let cls = '';
        if (st.selected === null) cls = 'empty';
        else if (label === correctOpt) cls = 'correct';
        else if (label === st.selected) cls = 'wrong';
        
        html += `<td class="${cls}">${label}</td>`;
      }
      html += '</tr>';
    });
    html += '</table>';
  }
  resContainer.innerHTML = html;
  resContainer.scrollIntoView({behavior: 'smooth'});
}

renderQuiz();
