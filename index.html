(function(){ 'use strict';
    const QUIZ = eval('(' + decodeURIComponent(escape(atob(''+__B64_QUIZ_DATA__+''))) + ')');
    
    let audioCtx;
    function initAudio() { if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } }
    function playTone(freq1, freq2, type, duration, vol) {
        try {
            initAudio();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq1, audioCtx.currentTime);
            if (freq2) osc.frequency.linearRampToValueAtTime(freq2, audioCtx.currentTime + duration/2);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e){}
    }
    function playSelectSound() { playTone(600, null, 'sine', 0.08, 0.15); }
    function playCorrectSound() { playTone(800, 1200, 'sine', 0.25, 0.2); }
    function playWrongSound() { playTone(150, null, 'sawtooth', 0.2, 0.12); }
    function playSubmitSound() { playTone(500, null, 'triangle', 0.12, 0.15); }

    const quizContainer = document.getElementById('questionsContainer');
    const startScreen = document.getElementById('startScreen');
    const testScreen = document.getElementById('testScreen');
    const resultScreen = document.getElementById('resultScreen');
    const resultDetails = document.getElementById('resultDetails');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const studentNameInput = document.getElementById('studentName');
    
    let locked = {}; 
    let submitted = false;
    let questions = [];

    const norm = s => String(s ?? '')
      .normalize('NFC')
      .replace(/[\u200B-\u200D\uFEFF]/g, '')          
      .replace(/[\u2018\u2019\u201B\u2032\u00B4`]/g, "'") 
      .replace(/[\u201C\u201D]/g, '"')
      .replace(/[\u2013\u2014]/g, '-')
      .replace(/\u00a0/g, ' ')
      .replace(/\s+/g, ' ')
      .replace(/\s+([.,!?;:])/g, '$1')
      .replace(/[.!?,;:]+$/, '')                       
      .trim().toLowerCase();
      
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    
    function isRewriteCorrect(q, val) {
      let normVal = norm(val);
      let ansArr = q.correctAnswers || [];
      return ansArr.some(ans => {
          let normAns = norm(ans);
          if (normAns === normVal) return true;
          /* partial matching removed to prevent antonym bugs */
          return false;
      });
    }

    function acceptedSet(q) {
      const set = new Set();
      (q.correctAnswers || []).forEach(a => set.add(norm(a)));
      return set;
    }

    function adaptQuestion(q, index) {
        let nq = JSON.parse(JSON.stringify(q));
        nq.id = (nq.id || nq.id === 0) ? String(nq.id) : String(index + 1);
        if (nq.question || nq.text || nq.questionText) nq.questionHTML = nq.question || nq.text || nq.questionText || nq.questionHTML;
        
        if (nq.questionHTML) {
            let m = nq.questionHTML.match(/^<b>([\s\S]*?)<\/b>\s*(?:<br\s*\/?>\s*)+/i);
            if (m) {
                if (!nq.showTitle) nq.showTitle = m[1];
                nq.questionHTML = nq.questionHTML.replace(/^<b>[\s\S]*?<\/b>\s*(?:<br\s*\/?>\s*)+/i, '');
            }
        }
        
        if (nq.originalSentenceHTML) {
            let m = nq.originalSentenceHTML.match(/^<b>([\s\S]*?)<\/b>\s*(?:<br\s*\/?>\s*)+/i);
            if (m) {
                if (!nq.showTitle) nq.showTitle = m[1];
                nq.originalSentenceHTML = nq.originalSentenceHTML.replace(/^<b>[\s\S]*?<\/b>\s*(?:<br\s*\/?>\s*)+/i, '');
            }
        }
        
        let stripped = false;
        nq.questionHTML = (nq.questionHTML || '').replace(/(^|<br\s*\/?>|<\/b>|<\/strong>|<\/p>)\s*(?:C[^\s]*\s*\d+[:\.]?\s*|\d+(?:[\.\)]|\b\s+)\s*)/i, (match, p1) => {
            if (!stripped) {
                stripped = true;
                return p1 + ' ';
            }
            return match;
        });
        if (nq.originalSentenceHTML) {
            nq.originalSentenceHTML = (nq.originalSentenceHTML || '').replace(/(^|<br\s*\/?>|<\/b>|<\/strong>|<\/p>)\s*(?:C[^\s]*\s*\d+[:\.]?\s*|\d+(?:[\.\)]|\s+)\s*)/i, (match, p1) => {
                return p1 + ' ';
            });
        }
        
        if (nq.type === 'sentence_rewrite') {
            if (nq.sampleAnswers && !nq.correctAnswers) nq.correctAnswers = nq.sampleAnswers;
            if (nq.answer && !nq.correctAnswers) nq.correctAnswers = [nq.answer];
        } else if (nq.type === 'multiple_choice' || nq.type === 'mcq') {
            let options = [];
            let correctAnsStr = nq.answer || nq.correctAnswer;
            (nq.options || []).forEach((opt, idx) => {
                if (typeof opt === 'string') {
                    let label = String.fromCharCode(65 + idx);
                    let html = opt;
                    let m = opt.match(/^([A-D])\s+(.*)/);
                    if (m) { label = m[1]; html = m[2]; }
                    options.push({label, html, isCorrect: (opt === correctAnsStr || (correctAnsStr && correctAnsStr.startsWith(label))) });
                } else {
                    options.push(opt);
                }
            });
            options.forEach((opt, idx) => { opt.displayLabel = String.fromCharCode(65 + idx); });
            nq.options = options;
        } else if (nq.type === 'gap_fill_text') {
            if (!nq.blanks) nq.blanks = [];
            if (nq.questionHTML && nq.questionHTML.includes('<input')) {
                let blankId = 1;
                nq.questionHTML = nq.questionHTML.replace(/<input[^>]+data-answer=['"]([^'"]+)['"][^>]*>/g, (match, ans) => {
                    let bid = 'b' + blankId++;
                    nq.blanks.push({blankId: bid, correctAnswers: [ans]});
                    return `{{blank:${bid}}}`;
                });
            }
        }
        return nq;
    }

    function init() {
        let lastTitle = null;
        questions = QUIZ.map((q, i) => {
            let nq = adaptQuestion(q, i);
            if (q.title && q.title !== lastTitle) {
                nq.showTitle = q.title;
                lastTitle = q.title;
            }
            return nq;
        });
        renderQuestions();
    }

    window.startTest = function() {
        let name = studentNameInput.value.trim();
        if(!name) { alert("Vui lòng nhập họ và tên!"); return; }
        initAudio();
        document.getElementById('startScreen').classList.remove('active');
        document.getElementById('testScreen').classList.add('active');
    };

    function preventNav(e) {
        e.preventDefault();
        e.returnValue = '';
    }
    window.addEventListener('beforeunload', preventNav);

    function renderQuestions() {
        quizContainer.innerHTML = '';
        questions.forEach((q, index) => {

                let titleDiv = document.createElement('div');
                titleDiv.className = 'instruction-box';
                titleDiv.innerHTML = q.showTitle;
                quizContainer.appendChild(titleDiv);
            }
            
            let div = document.createElement('div');
            div.className = 'question-block';
            div.id = 'q-block-' + q.id;
            
            let qNumStr = `<strong>Câu ${index + 1}: </strong>`;
            
            let html = '';

                q.options.forEach((opt, oIdx) => {
                    let textToShow = (opt.html || opt.text || '').replace(/^[A-D]\.\s*/, '');
                    html += `<div class="option" data-qid="${q.id}" data-idx="${oIdx}">
                        <div class="radio-circle"></div> <b>${esc(opt.displayLabel || opt.label)}.</b> ${textToShow}
                    </div>`;
                });
                html += `</div><div><button class="check-btn" id="check-btn-${q.id}" data-qid="${q.id}">Kiểm tra</button></div>`;
            } else if (q.type === 'gap_fill_text') {
                let text = q.questionHTML;
                q.blanks.forEach(b => {
                    let searchStr = `{{blank:${b.blankId}}}`;
                    let inputHtml = `<input type="text" class="gap-fill-input" id="input-${q.id}-${b.blankId}" autocomplete="off" spellcheck="false" maxlength="80"> <span id="gap-res-${q.id}-${b.blankId}"></span>`;
                    if (text.includes(searchStr)) text = text.replace(searchStr, inputHtml);
                    else text += ' ' + inputHtml;
                });

                        <div><button class="check-btn" id="check-btn-${q.id}" data-qid="${q.id}">Kiểm tra</button></div>`;
            } else if (q.type === 'sentence_rewrite') {
                html = `<div class="question-text">${qNumStr} ${q.originalSentenceHTML ? q.originalSentenceHTML + '<br>' : ''}${q.questionHTML}</div>
                        <input type="text" class="rewrite-input" id="input-${q.id}" autocomplete="off" spellcheck="false" >
                        <div id="rw-res-${q.id}"></div>
                        <div><button class="check-btn" id="check-btn-${q.id}" data-qid="${q.id}">Kiểm tra</button></div>`;
            } else if (q.type === 'reordering') {
                html = `<div class="question-text">${qNumStr} ${q.questionHTML}</div>
                        <div class="word-bank" id="reorder-${q.id}">`;
                let tokens = [...q.correctOrder]; for(let i = tokens.length - 1; i > 0; i--){const j = Math.floor(Math.random() * (i + 1)); [tokens[i], tokens[j]] = [tokens[j], tokens[i]];}
                tokens.forEach(tok => { 
                    let w = (q.words && q.words.find(x => x.tokenId === tok)) || (q.tokens && q.tokens.find(x => x.tokenId === tok));
                    let text = w ? w.text : tok;
                    html += `<span class="word-chip" data-qid="${q.id}" data-token="${esc(tok)}">${esc(text)}</span>`; 
                });
                html += `</div><div class="drop-zone" id="target-${q.id}"></div>
                        <div><button class="check-btn" id="check-btn-${q.id}" data-qid="${q.id}">Kiểm tra</button></div>`;
            }
            
            html += `<div class="explanation" id="expl-${q.id}"></div>`;
            div.innerHTML = html;
            quizContainer.appendChild(div);
        });

        document.querySelectorAll('input').forEach(inp => {
            inp.addEventListener('input', () => { if(inp.value.length === 1) playSelectSound(); });
        });
    }
    
    quizContainer.addEventListener('click', e => {
        if (submitted) return;
        
        let opt = e.target.closest('.option');
        if (opt) {
            let qid = opt.getAttribute('data-qid');
            if (locked[qid]) return;
            let qBlock = document.getElementById('q-block-' + qid);
            qBlock.querySelectorAll('.option').forEach(o => { o.classList.remove('selected'); });
            opt.classList.add('selected');
            qBlock.setAttribute('data-selected-idx', opt.getAttribute('data-idx'));
            playSelectSound();
        }
        
        let chip = e.target.closest('.word-chip');
        if (chip) {
            let qid = chip.getAttribute('data-qid');
            if (locked[qid]) return;
            let target = document.getElementById('target-' + qid);
            let source = document.getElementById('reorder-' + qid);
            if (chip.parentElement.id === 'reorder-' + qid) {
                target.appendChild(chip);
            } else {
                source.appendChild(chip);
            }
            playSelectSound();
        }

        let btn = e.target.closest('.check-btn');
        if (btn) {
            let qid = btn.getAttribute('data-qid');
            if (locked[qid]) return;
            let q = questions.find(x => x.id === qid);
            
            if (q.type === 'multiple_choice' || q.type === 'mcq') {
                let qBlock = document.getElementById('q-block-' + qid);
                if (!qBlock.hasAttribute('data-selected-idx')) { alert("Bạn chưa chọn đáp án!"); return; }
                let idx = parseInt(qBlock.getAttribute('data-selected-idx'));
                locked[qid] = { idx };
                let opt = qBlock.querySelector('.option[data-idx="'+idx+'"]');
                checkMCQ(q, opt, idx);
                btn.disabled = true;
            } else if (q.type === 'gap_fill_text') {
                let ans = {};
                let empty = true;
                q.blanks.forEach(b => {
                    let el = document.getElementById(`input-${q.id}-${b.blankId}`);
                    let val = el ? el.value.trim() : "";
                    ans[b.blankId] = val;
                    if (val) empty = false;
                });
                if (empty) { alert("Bạn chưa điền đáp án!"); return; }
                locked[qid] = { ans };
                checkGap(q, ans, btn);
            } else if (q.type === 'sentence_rewrite') {
                let el = document.getElementById(`input-${q.id}`); let val = el ? el.value.trim() : "";
                if (!val) { alert("Bạn chưa viết câu trả lời!"); return; }
                locked[qid] = { val };
                checkRewrite(q, val, btn);
            } else if (q.type === 'reordering') {
                let tz = document.getElementById(`target-${q.id}`);
                if (tz.children.length === 0) { alert("Bạn chưa ghép từ!"); return; }
                let order = Array.from(tz.children).map(c => c.getAttribute('data-token'));
                locked[q.id] = { order };
                checkReorder(q, order, btn);
            }
        }
    });

    function showExplanation(q) {
        let ex = document.getElementById('expl-' + q.id);
        if (q.explanationHTML && ex) {
            ex.innerHTML = q.explanationHTML.includes('Giải thích:') ? q.explanationHTML : '<strong>Giải thích:</strong><br>' + q.explanationHTML;
            ex.style.display = 'block';
        }
    }

    function checkMCQ(q, optEl, idx) {
        let isCorrect = q.options[idx].isCorrect;
        if (isCorrect) {
            optEl.classList.add('correct-opt');
            playCorrectSound();
        } else {
            optEl.classList.add('wrong-opt');
            playWrongSound();
            let correctOpt = q.options.find(o => o.isCorrect);
            if (correctOpt) {
                let correctIdx = q.options.indexOf(correctOpt);
                document.querySelector(`.option[data-qid="${q.id}"][data-idx="${correctIdx}"]`).classList.add('correct-opt');
            }
        }
        document.getElementById('q-block-' + q.id).style.pointerEvents = 'none';
        showExplanation(q);
    }
    
    function checkGap(q, ans, btn) {
        let allCorrect = true;
        q.blanks.forEach(b => {
            let val = ans[b.blankId];
            let isCorrect = false;
            b.correctAnswers.forEach(ca => { if(norm(ca) === norm(val)) isCorrect = true; });
            let resSpan = document.getElementById(`gap-res-${q.id}-${b.blankId}`);
            let inputEl = document.getElementById(`input-${q.id}-${b.blankId}`);
            if (isCorrect) {
                inputEl.style.backgroundColor = '#eafaf1';
                inputEl.style.borderColor = '#2ecc71';
                resSpan.innerHTML = ` <span style="color:#2ecc71;font-weight:bold;">✓ Chính xác!</span>`;
            } else {
                allCorrect = false;
                inputEl.style.backgroundColor = '#fdedec';
                inputEl.style.borderColor = '#e74c3c';
                resSpan.innerHTML = ` <span style="color:#2ecc71; font-weight:bold; margin-left: 5px;">${esc(b.correctAnswers[0])}</span>`;
            }
        });
        if (allCorrect) playCorrectSound(); else playWrongSound();
        document.getElementById('q-block-' + q.id).style.pointerEvents = 'none';
        btn.disabled = true;
        showExplanation(q);
    }
    

    function getExpectedRewrite(q) {
        let expected = q.correctAnswers[0];
        let cleanQh = (q.questionHTML || '').replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ');
        let parts = cleanQh.split(/_+/);
        if (parts.length >= 2) {
            let prefix = parts[0].replace(/^[\s\u2192\-\>]+/, '').trim();
            let suffix = parts[1].trim();
            if (prefix) {
                let escPrefix = prefix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                let regex = new RegExp('^' + escPrefix + '(?=\\s|$)\\s*', 'i');
                if (regex.test(expected)) {
                    expected = expected.replace(regex, '').trim();
                }
            }
            if (suffix) {
                let escSuffix = suffix.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                let regex2 = new RegExp('\\s*' + escSuffix + '(?=\\s|$|\\W)', 'i');
                if (regex2.test(expected)) {
                    expected = expected.replace(regex2, '').trim();
                } else if (suffix === '.') {
                    expected = expected.replace(/\.$/, '').trim();
                }
            } else {
                expected = expected.replace(/\.$/, '').trim();
            }
        }
        return expected;
    }

    function checkRewrite(q, val, btn) {
        let expected = getExpectedRewrite(q);
        let uVal = val.trim();
        if (uVal.endsWith('.') && !expected.endsWith('.')) uVal = uVal.slice(0, -1);
        let isCorrect = (norm(uVal) === norm(expected)) || acceptedSet(q).has(norm(val));
        
        let rwRes = document.getElementById('rw-res-' + q.id);
        let inputEl = document.getElementById('input-' + q.id);
        if (isCorrect) {
            inputEl.style.backgroundColor = '#eafaf1';
            inputEl.style.borderColor = '#2ecc71';
            rwRes.innerHTML = `<span style="color:#2ecc71;font-weight:bold;">&#10003; Chính xác!</span>`;
            playCorrectSound();
        } else {
            inputEl.style.backgroundColor = '#fdedec';
            inputEl.style.borderColor = '#e74c3c';
            rwRes.innerHTML = `<span style="color:#2ecc71; font-weight:bold; margin-left: 5px;">${esc(expected)}</span>`;
            playWrongSound();
        }
        inputEl.disabled = true;
        btn.disabled = true;
        showExplanation(q);
    }





    function checkReorder(q, order, btn) {
        let isCorrect = order.join(' ') === q.correctOrder.join(' ');
        let tz = document.getElementById('target-' + q.id);
        if (isCorrect) {
            tz.style.backgroundColor = '#eafaf1';
            tz.style.borderColor = '#2ecc71';
            playCorrectSound();
        } else {
            tz.style.backgroundColor = '#fdedec';
            tz.style.borderColor = '#e74c3c';
            let div = document.createElement('div');
            div.style.marginTop = '10px';
            div.innerHTML = `<strong style="color:#2ecc71;">Đáp án:</strong> ${esc(q.correctOrder.join(' '))}`;
            tz.parentNode.insertBefore(div, btn.parentNode);
            playWrongSound();
        }
        document.getElementById('q-block-' + q.id).style.pointerEvents = 'none';
        btn.disabled = true;
        showExplanation(q);
    }
    
    window.confirmSubmit = function() {
        if (!confirm("Bạn có chắc chắn muốn nộp bài?")) return;
        window.removeEventListener('beforeunload', preventNav);
        submitted = true;
        playSubmitSound();
        
        let correctCount = 0;
        let gradableCount = 0;
        let wrongHTML = '<h3 style="color:#e74c3c;text-align:left;margin-top:0;">DANH SÁCH CÁC CÂU LÀM SAI / CHƯA LÀM</h3>';
        let sheetReport = `DANH SACH CAC CAU LAM SAI / CHUA LAM

`;
        let hasWrong = false;
        
        questions.forEach((q, index) => {
            let l = locked[q.id];
            let isGradable = (q.type !== 'short_answer');
            if (isGradable) gradableCount++;
            
            let isCorrect = false;
            let hsStr = "(Bạn chưa trả lời)";
            let rightStr = "";
            
            if (!l) {
                let hasValue = false;
                if (q.type === 'multiple_choice' || q.type === 'mcq') {
                    let qBlock = document.getElementById('q-block-' + q.id);
                    if (qBlock && qBlock.hasAttribute('data-selected-idx')) {
                        let idx = parseInt(qBlock.getAttribute('data-selected-idx'));
                        locked[q.id] = { idx };
                        l = locked[q.id];
                        hasValue = true;
                    }
                } else if (q.type === 'gap_fill_text') {
                    let ans = {};
                    let empty = true;
                    q.blanks.forEach(b => {
                        let el = document.getElementById(`input-${q.id}-${b.blankId}`);
                        let val = el ? el.value.trim() : "";
                        ans[b.blankId] = val;
                        if (val) empty = false;
                    });
                    if (!empty) {
                        locked[q.id] = { ans };
                        l = locked[q.id];
                        hasValue = true;
                    }
                } else if (q.type === 'sentence_rewrite') {
                    let el = document.getElementById(`input-${q.id}`); 
                    let val = el ? el.value.trim() : "";
                    if (val) {
                        locked[q.id] = { val };
                        l = locked[q.id];
                        hasValue = true;
                    }
                } else if (q.type === 'reordering') {
                    let tz = document.getElementById(`target-${q.id}`);
                    if (tz && tz.children.length > 0) {
                        let order = Array.from(tz.children).map(c => c.getAttribute('data-token'));
                        locked[q.id] = { order };
                        l = locked[q.id];
                        hasValue = true;
                    }
                }

                if (!hasValue) {
                    isCorrect = false;
                    hsStr = "(Bạn chưa trả lời)";
                    if (q.type === 'multiple_choice' || q.type === 'mcq') {
                        let co = q.options.find(o => o.isCorrect);
                        rightStr = co ? `${co.displayLabel || co.label} (${(co.text || co.html).replace(/<[^>]*>?/gm, '')})` : '';
                    } else if (q.type === 'gap_fill_text') {
                        rightStr = q.blanks.map(b => b.correctAnswers[0]).join(', ');
                    } else if (q.type === 'reordering') {
                        rightStr = q.correctOrder.map(tok => { let w = (q.words && q.words.find(x => x.tokenId === tok)) || (q.tokens && q.tokens.find(x => x.tokenId === tok)); return w ? w.text : tok; }).join(' ');
                    } else if (q.type === 'sentence_rewrite') {
                        rightStr = q.correctAnswers[0];
                    }
                }
            }
            
            if (l) {
                if (q.type === 'multiple_choice' || q.type === 'mcq') {
                    isCorrect = q.options[l.idx].isCorrect;
                    hsStr = `${q.options[l.idx].displayLabel || q.options[l.idx].label} (${(q.options[l.idx].text || q.options[l.idx].html).replace(/<[^>]*>?/gm, '')})`;
                    let co = q.options.find(o => o.isCorrect);
                    rightStr = co ? `${co.displayLabel || co.label} (${(co.text || co.html).replace(/<[^>]*>?/gm, '')})` : '';
                } else if (q.type === 'gap_fill_text') {
                    isCorrect = true;
                    let hsArr = []; let rightArr = [];
                    q.blanks.forEach(b => {
                        let v = l.ans[b.blankId];
                        hsArr.push(v);
                        rightArr.push(b.correctAnswers[0]);
                        let c = false;
                        b.correctAnswers.forEach(ca => { if(norm(ca) === norm(v)) c = true; });
                        if (!c) isCorrect = false;
                    });
                    hsStr = hsArr.join(', ');
                    rightStr = rightArr.join(', ');
                } else if (q.type === 'reordering') {
                    isCorrect = l.order.join(' ') === q.correctOrder.join(' ');
                    let mapToken = tok => { let w = (q.words && q.words.find(x => x.tokenId === tok)) || (q.tokens && q.tokens.find(x => x.tokenId === tok)); return w ? w.text : tok; };
                    hsStr = l.order.map(mapToken).join(' ');
                    rightStr = q.correctOrder.map(mapToken).join(' ');
                } else if (q.type === 'sentence_rewrite') {
                    isCorrect = isRewriteCorrect(q, l.val);
                    hsStr = l.val;
                    rightStr = q.correctAnswers[0];
                }
            }
            
            if (isGradable && isCorrect) {
                correctCount++;
            } else if (isGradable && !isCorrect) {
                hasWrong = true;
                sheetReport += `Câu ${index + 1}: Học sinh: ${hsStr} | Đáp án đúng: ${rightStr}
`;
                wrongHTML += `<div class="error-item">
                    <strong>Câu ${index + 1}:</strong> ${q.questionHTML.replace(/\{\{blank:[^\}]+\}\}/g, '___')}<br>
                    <span style="color:#e74c3c;">Học sinh: <span style="${hsStr.includes('chưa trả lời') ? '' : 'text-decoration:line-through;'}">${esc(hsStr)}</span></span><br>
                    <span style="color:#2ecc71; font-weight:bold;">Đáp án đúng: ${esc(rightStr)}</span>
                    <div style="margin-top:5px;font-size:13.5px;color:#333;">${q.explanationHTML ? (q.explanationHTML.includes('Giải thích:') ? q.explanationHTML : '<em>Giải thích:</em><br>' + q.explanationHTML) : ''}</div>
                </div>`;
            }
        });
        
        document.getElementById('testScreen').classList.remove('active');
        resultScreen.classList.add('active');
        if (gradableCount > 0) {
            let scale10 = parseFloat(((correctCount / gradableCount) * 10).toFixed(2));
            scoreDisplay.innerHTML = `${scale10} <span style="font-size:32px; color:#7f8c8d;">/ 10</span><br><span style="font-size:18px; color:#95a5a6; font-weight:normal;">(Đúng ${correctCount}/${gradableCount} câu)</span>`;
            if (correctCount === gradableCount) {
                resultDetails.innerHTML = '<h2 style="color:#2ecc71;text-align:center;">TUYỆT VỜI! ĐÚNG 100%</h2>';
                playCorrectSound();
            } else {
                resultDetails.innerHTML = wrongHTML;
            }
        } else {
            scoreDisplay.textContent = "Không chấm điểm";
            resultDetails.innerHTML = '<p>Bài này không có câu trắc nghiệm được chấm tự động.</p>';
        }
        
        
        try {
            const formUrl = 'https://docs.google.com/forms/d/e/1FAIpQLSfZCAK2lpNE8O8Ieqwc3SI1ubr6HZDvGZR91AsSpUk8kEBqaA/formResponse';
            const formData = new FormData();
            let studentName = document.getElementById('studentName') ? document.getElementById('studentName').value.trim() : 'Unknown';
            formData.append('entry.1861648410', studentName);
            let finalScore = gradableCount > 0 ? (correctCount * 10 / gradableCount).toFixed(2) : 0;
            formData.append('entry.1691800437', finalScore);
            const plainErrorReport = hasWrong ? sheetReport : 'Perfect';
            formData.append('entry.639295732', plainErrorReport);
            let pageTitle = document.title || location.pathname.split('/').pop() || 'Unknown';
            formData.append('entry.370465671', pageTitle);
            fetch(formUrl, { method: 'POST', mode: 'no-cors', body: formData }).catch(e => console.error(e));
        } catch (err) {
            console.error("Form submit error", err);
        }
        
        document.querySelectorAll('.check-btn').forEach(b => b.disabled = true);
        document.querySelectorAll('input, .option, .word-chip').forEach(el => { el.disabled = true; el.style.pointerEvents = 'none'; el.style.opacity = '0.7'; });

    };

    window.onload = init;
})();

    </script>
